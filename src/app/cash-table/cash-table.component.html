<div class="mat-elevation-z2">
  <table mat-table class="full-width-table" matSort aria-label="Elements">
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>{{'Event' | localize}}</th>
      <td mat-cell *matCellDef="let row">{{row.title | localize}}</td>
    </ng-container>

    <ng-container matColumnDef="purse">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>{{'Purse' | localize}}</th>
      <td mat-cell *matCellDef="let row">
        {{ row.budget.totalprize | roundThousands | currency:'JPY':'symbol':'1.0-0' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="payout">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>{{'Payout' | localize}}</th>
      <td mat-cell *matCellDef="let row">{{ row.budget.prizeratio | percent:'1.0-0' }}</td>
    </ng-container>

    <ng-container matColumnDef="cashing">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>{{'Cashing' | localize}}</th>
      <td mat-cell *matCellDef="let row">{{row.budget.paidratio | percent:'1.0-0'}}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"
      class="event-element-row" (click)="onRawClicked(row)">
    </tr>
  </table>

  <mat-paginator #paginator
      [length]="dataSource.data.length"
      [pageIndex]="0"
      [pageSize]="30"
      [pageSizeOptions]="[30, 60, 120]"
      aria-label="Select page">
  </mat-paginator>
</div>
